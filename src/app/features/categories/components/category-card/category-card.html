<div class="card" [class.is-hidden]="category().isHidden">
  <div class="icon-and-details">
    <div
      class="icon-wrapper"
      [style.background-color]="(category().colorHex ?? '#78716c') + '33'"
      [style.color]="category().colorHex ?? '#78716c'"
    >
      <app-icon [weight]="600">{{ category().iconName || 'local_offer' }}</app-icon>
    </div>
    <div class="details">
      <p class="name">{{ category().categoryName }}</p>
    </div>
  </div>

  <div class="actions">
    <app-button
      variant="secondary"
      [icon]="category().isHidden ? 'visibility' : 'visibility_off'"
      [iconOnly]="true"
      (clicked)="onToggleHide()"
    />
    <app-button variant="primary" icon="edit" [iconOnly]="true" (clicked)="onEdit()" />
    <app-button variant="primary" icon="delete" [iconOnly]="true" (clicked)="onDelete()" />
  </div>
</div>
