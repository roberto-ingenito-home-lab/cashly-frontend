<div class="layout-container">
  <nav>
    <div class="nav-inner">
      <p class="cashly-label">Cashly</p>

      <span class="page-title">Cashly</span>

      <div class="links">
        @for (item of navItems; track item.route) {
          <a [routerLink]="item.route" routerLinkActive="active">
            {{ item.label }}
          </a>
        }
      </div>

      <div class="actions">
        <button
          mat-icon-button
          type="button"
          matTooltip="Ricarica"
          (click)="refreshPage()"
        >
          <app-icon>refresh</app-icon>
        </button>

        <button
          mat-icon-button
          type="button"
          [matTooltip]="isDark() ? 'Tema chiaro' : 'Tema scuro'"
          (click)="toggleTheme()"
        >
          <app-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</app-icon>
        </button>

        <button mat-icon-button type="button" matTooltip="Logout" (click)="logout()">
          <app-icon>move_item</app-icon>
        </button>
      </div>
    </div>
  </nav>

  <div class="scroll-container">
    <main>
      @if (isLoading()) {
        <mat-spinner diameter="50" />
      } @else {
        <router-outlet />
      }
    </main>
  </div>

  <div class="bottom-nav">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="bottom-nav-item"
      >
        <app-icon>{{ item.icon }}</app-icon>
        <span class="bottom-nav-label">{{ item.label }}</span>
      </a>
    }
  </div>
</div>
