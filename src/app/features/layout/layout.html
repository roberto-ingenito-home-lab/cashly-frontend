<div class="layout-container">
  <nav>
    <div class="nav-inner">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        class="cashly-label"
      >
        Cashly
      </a>

      <div class="links">
        @for (item of navItems; track item.route) {
          <a [routerLink]="item.route" routerLinkActive="active">
            {{ item.label }}
          </a>
        }
      </div>

      <div class="actions">
        <button
          mat-icon-button
          type="button"
          matTooltip="Ricarica"
          (click)="refreshPage()"
        >
          <app-icon>refresh</app-icon>
        </button>

        <button
          mat-icon-button
          type="button"
          matTooltip="Profilo"
          aria-label="Profilo"
          [matMenuTriggerFor]="profileMenu"
        >
          <app-icon>person</app-icon>
        </button>

        <mat-menu #profileMenu="matMenu" xPosition="before" class="profile-menu">
          <div class="profile-menu-email" (click)="$event.stopPropagation()">
            <span class="profile-menu-email-label">Account</span>
            <span class="profile-menu-email-value">{{ userEmail() }}</span>
          </div>

          <mat-divider />

          <a mat-menu-item routerLink="/categories">
            <app-icon>category</app-icon>
            <span>Categorie</span>
          </a>

          <button mat-menu-item type="button" (click)="toggleTheme()">
            <app-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</app-icon>
            <span>{{ isDark() ? 'Tema chiaro' : 'Tema scuro' }}</span>
          </button>

          <button mat-menu-item type="button" (click)="openChangePasswordDialog()">
            <app-icon>lock_reset</app-icon>
            <span>Cambia password</span>
          </button>

          <mat-divider />

          <button mat-menu-item type="button" class="logout-item" (click)="logout()">
            <app-icon>logout</app-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </div>
    </div>
  </nav>

  <div class="scroll-container">
    <main>
      @if (isLoading()) {
        <mat-spinner diameter="50" />
      } @else {
        <router-outlet />
      }
    </main>
  </div>

  <div class="bottom-nav">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="bottom-nav-item"
      >
        <app-icon>{{ item.icon }}</app-icon>
        <span class="bottom-nav-label">{{ item.label }}</span>
      </a>
    }
  </div>
</div>
