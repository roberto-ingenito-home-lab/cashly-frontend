<h2 mat-dialog-title>Filtra Transazioni</h2>

<mat-dialog-content>
  <div class="filter-form">
    <div class="field" [formGroup]="typesForm">
      <label class="field-label">Tipo transazione</label>
      <div class="checkbox-group">
        <mat-checkbox formControlName="income">Entrate</mat-checkbox>
        <mat-checkbox formControlName="expense">Uscite</mat-checkbox>
        <mat-checkbox formControlName="transferOut">Trasf. in uscita</mat-checkbox>
        <mat-checkbox formControlName="transferIn">Trasf. in entrata</mat-checkbox>
      </div>
    </div>

    <form [formGroup]="form">
      <app-category-select formControlName="categoryId" emptyLabel="Tutte" />
    </form>

    <mat-form-field appearance="outline" class="date-range-field">
      <mat-label>Periodo (da - a)</mat-label>
      <mat-date-range-input [formGroup]="rangeForm" [rangePicker]="picker">
        <input matStartDate formControlName="start" placeholder="Data inizio">
        <input matEndDate formControlName="end" placeholder="Data fine">
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <app-button variant="outlined" (clicked)="reset()">Reimposta</app-button>
  <div class="primary-actions">
    <app-button variant="secondary" (clicked)="cancel()">Annulla</app-button>
    <app-button variant="primary" (clicked)="apply()">Applica</app-button>
  </div>
</mat-dialog-actions>
