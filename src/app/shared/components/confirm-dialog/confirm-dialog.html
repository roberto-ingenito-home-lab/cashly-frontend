<h2 mat-dialog-title>{{ data.title }}</h2>

@if (data.message) {
  <mat-dialog-content>
    <p class="message">{{ data.message }}</p>
  </mat-dialog-content>
}

<mat-dialog-actions class="dialog-actions">
  <app-button variant="secondary" (clicked)="cancel()">Annulla</app-button>
  <app-button [variant]="variant" (clicked)="confirm()">{{ confirmLabel }}</app-button>
</mat-dialog-actions>
